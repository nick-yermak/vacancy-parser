[project]
name = "vacancy-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nick Yermak", email = "139969781+nick-yermak@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.6.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "typer>=0.29.2",
]

[project.scripts]
vacancy-parser = "vacancy_parser:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific (incl. RUF001 ambiguous unicode)
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-m",
    "not integration",
]
markers = [
    "integration: calls a real external API; deselected by default via addopts",
]
